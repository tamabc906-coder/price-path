<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Price Path — monogram P: thân chữ P vàng, bụng chữ P là ba lớp nón xoè sang phải (90/80/50 %),
       trung vị nét đứt kem. Lưới 120×120, nền tím bo góc 28. Toạ độ dùng chung với scripts/make_icons.py. -->
  <rect width="120" height="120" rx="28" fill="#3B2A6B"/>
  <!-- ba lớp bụng P lồng nhau, mở về bên phải: nhạt → đậm -->
  <path d="M40 18 H75 A29 29 0 0 1 75 76 H40 Z" fill="#E3B54D" fill-opacity="0.30"/>
  <path d="M40 27 H70 A20 20 0 0 1 70 67 H40 Z" fill="#E3B54D" fill-opacity="0.60"/>
  <path d="M40 35 H64 A12 12 0 0 1 64 59 H40 Z" fill="#E3B54D"/>
  <!-- trung vị -->
  <line x1="44" y1="47" x2="101" y2="47" stroke="#F7F4EC" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7"/>
  <!-- thân chữ P -->
  <rect x="22" y="18" width="18" height="84" rx="6" fill="#E3B54D"/>
</svg>
