# Job sau phiên. 08:40 UTC = 15:40 giờ VN — lệch TuDoanh Radar (15:20) và candle-radar (15:35) để ba app
# không réo cùng lúc, và để DNSE có thêm thời gian chốt nến. Cron dự phòng (16:10, 16:50, 18:15 VN) chạy lại
# nếu lần trước bị GitHub trễ/bỏ HOẶC nguồn chưa chốt — job idempotent nên có file hôm nay rồi thì thoát ngay.
# Chép khuôn candle-radar; commit thêm data/history.json (kho nến) và model/artifacts/conformal_state.json.
name: daily

on:
  schedule:
    - cron: "40 8 * * 1-5"
    - cron: "10 9 * * 1-5"
    - cron: "50 9 * * 1-5"
    - cron: "15 11 * * 1-5"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Chạy lại dù hôm nay đã có file"
        default: "false"
      test_push:
        description: "Gửi một thông báo thử tới mọi máy đã đăng ký"
        default: "false"

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Thông báo thử (khi bấm workflow_dispatch với test_push=true)
        if: ${{ github.event.inputs.test_push == 'true' }}
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          PUSH_SUBS_FALLBACK: ${{ secrets.PUSH_SUBS_FALLBACK }}
        run: python -m job.push --test

      - name: Dự báo nón + push
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          PUSH_SUBS_FALLBACK: ${{ secrets.PUSH_SUBS_FALLBACK }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE=--force; else FORCE=; fi
          python -m job.run_daily $FORCE

      - name: Commit kết quả
        run: |
          git config user.name "price-path-bot"
          git config user.email "price-path-bot@users.noreply.github.com"
          git add docs/data/ data/history.json model/artifacts/conformal_state.json
          if git diff --cached --quiet; then echo "không có gì mới"; exit 0; fi
          git commit -m "daily: $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase
          git push
