# Job vùng giá (zone/), chạy ĐỘC LẬP với daily.yml. 08:50 UTC = 15:50 VN — sau daily (15:40) để kho nến
# data/history.json đã có nến hôm nay (hệ số điều chỉnh + giá hiện tại). Dự phòng 16:25, 18:30 VN nếu GitHub
# trễ/bỏ; và 08:15 VN sáng hôm sau (T3–T7) vì VNDirect chỉ giữ tick của PHIÊN GẦN NHẤT — tới ~09:00 phiên mới
# bắt đầu là mất. Job idempotent theo (mã, ngày): đã có phiên thật thì không gọi nguồn, không có gì mới thì
# không ghi latest.json → cron dự phòng không đẻ commit rác.
name: zone

on:
  schedule:
    - cron: "50 8 * * 1-5"
    - cron: "25 9 * * 1-5"
    - cron: "30 11 * * 1-5"
    - cron: "15 1 * * 2-6"
  # Đẩy code → chạy ngay để biết môi trường Actions ổn (không có phiên mới thì thoát, không commit).
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: "Gọi nguồn lại dù đã có phiên thật hôm nay (ghi đè)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: zone
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # continue-on-error: run_daily trả 1 chỉ để BÁO "có mã lỗi" — nó đã ghi xong latest.json + state.json
      # trước khi trả. Không có dòng này thì step commit bị skip và một tick thiếu của MỘT mã làm mất trắng
      # dữ liệu của 38 mã còn lại (TCB hụt 500 cp phiên 23/09/2026 → đỏ 3/3 lượt, mất cả phiên).
      - name: Gom tick + dựng vùng giá
        id: collect
        continue-on-error: true
        # Khoá gửi thông báo vùng giá + cá mập (zone/alerts.py, 25/09/2026) — cùng bộ secrets với daily.yml
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
          PUSH_SUBS_FALLBACK: ${{ secrets.PUSH_SUBS_FALLBACK }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then FORCE=--force; else FORCE=; fi
          python -m zone.run_daily $FORCE

      - name: Commit kết quả
        if: always()
        run: |
          git config user.name "price-path-bot"
          git config user.email "price-path-bot@users.noreply.github.com"
          git add data/zone/ docs/data/zone/
          if git diff --cached --quiet; then echo "không có gì mới"; exit 0; fi
          git commit -m "zone: $(date -u +%Y-%m-%d) [skip ci]"
          # job/watchlist.load() ghi lại docs/data/watchlist.json (bản chụp danh mục) — file dirty làm
          # `git pull --rebase` từ chối (đỏ 3/3 lần 21/09/2026). Bỏ nó đi: daily.yml đã commit file đó mỗi ngày.
          git checkout -- docs/data/watchlist.json
          git status --short
          git pull --rebase
          git push

      # Commit xong RỒI mới báo đỏ: vẫn thấy lỗi trên tab Actions mà không đánh đổi dữ liệu.
      # continue-on-error ở trên làm `failure()` không còn đúng → phải xét outcome của chính step đó.
      - name: Báo đỏ nếu có mã lỗi
        if: steps.collect.outcome == 'failure'
        run: |
          echo "zone.run_daily thoát khác 0 — xem step 'Gom tick + dựng vùng giá'. Dữ liệu (nếu có) đã commit."
          exit 1
